var LABEL_LAYERS=[],labelMarkers=[],labelSig="",labelMiss=0,labelFallback=false;
function kraftStyle(st){
  LABEL_LAYERS=[];
  var C={land:PAL.land,water:PAL.water,park:PAL.park,bld:PAL.bld,road:PAL.road,casing:PAL.casing,ink:PAL.ink,rn:PAL.rn};
  function W(a,b,c){return ["interpolate",["exponential",1.55],["zoom"],8,a,13,b,18,c]}
  st.layers.forEach(function(l){
    var sl=l["source-layer"]||"",id=l.id||"",p=l.paint=l.paint||{};
    try{
    if(l.type==="background"){p["background-color"]=C.land}
    else if(l.type==="fill"){
      var col=C.land;
      if(sl==="water")col=C.water;
      else if(sl==="park"||sl==="landcover"||/park|wood|grass|forest|pitch|cemetery|golf|garden/.test(id))col=C.park;
      else if(sl==="building"||/building/.test(id))col=C.bld;
      p["fill-color"]=col;delete p["fill-pattern"];
      if(col===C.park||col===C.water)p["fill-opacity"]=1;
    }
    else if(l.type==="line"){
      var isRoad=(sl==="transportation"||/road|street|path|bridge|tunnel|motorway|highway|rail/.test(id));
      if(sl==="waterway"||/waterway|river|stream|canal/.test(id)){p["line-color"]=C.water;p["line-width"]=W(1.5,9,28);p["line-opacity"]=1}
      else if(isRoad){
        if(/rail/.test(id)){p["line-color"]=C.ink;p["line-width"]=W(.6,1.4,3)}
        else{
          var big=/motorway|trunk|major|primary/.test(id),mid=/secondary|tertiary/.test(id),thin=/path|pedestrian|track|footway/.test(id);
          var w=big?W(1.2,8,34):mid?W(.8,6,26):thin?W(.5,1.8,5):W(.6,4.5,20);
          var casing=/casing|outline/.test(id);
          p["line-color"]=casing?C.casing:C.road;
          p["line-width"]=casing?W((big?1.2:.8)+1.6,(big?8:mid?6:thin?1.8:4.5)+3.2,(big?34:mid?26:thin?5:20)+6):w;
          p["line-opacity"]=1;
          if(thin&&!casing){p["line-color"]=C.casing}
        }
      }
      else if(sl==="boundary"||/boundary/.test(id)){p["line-color"]="#a8805a"}
    }
    else if(l.type==="symbol"){
      var road=/road|highway|street|path|ref|shield/.test(id)&&!/place|poi/.test(id);
      if(sl==="place"||sl==="park"||sl==="poi"||sl==="aerodrome_label"||/place|poi|park|aerodrome/.test(id)&&!/road|highway|street|path|ref|shield/.test(id)){LABEL_LAYERS.push(id);p["text-opacity"]=0;p["icon-opacity"]=0;return}
      p["text-color"]=road?C.rn:C.ink;p["text-halo-color"]=C.land;p["text-halo-width"]=1.8;
      if(road){l.layout=l.layout||{};l.layout["text-transform"]="uppercase";l.layout["text-letter-spacing"]=0.04}
    }
    else if(l.type==="fill-extrusion"){p["fill-extrusion-color"]=C.bld}
    }catch(e){}
  });
  return st;
}

var EXTRA_LABELS=[
 ["Market Square",52.20515,0.1191,1],["King’s College",52.2043,0.1165,0],["Fitzwilliam Museum",52.1999,0.1206,0],
 ["Parker’s Piece",52.2018,0.1283,0],["Jesus Green",52.2118,0.1190,0],["Midsummer Common",52.2112,0.1285,0],

 ["Cambridge North",52.2236,0.1243,1],["Magdalene Bridge",52.2108,0.1170,0],["Newnham",52.1975,0.1085,0],
 ["Chesterton",52.2190,0.1305,0],["Trumpington",52.1740,0.1130,1],["Cherry Hinton",52.1890,0.1670,1]
];
var SIZES={city:19,town:17,village:15,suburb:14,quarter:14,neighbourhood:13,hamlet:12,isolated_dwelling:12};
function drawPlaceLabels(){
  var ids=LABEL_LAYERS.filter(function(i){return map.getLayer(i)});
  if(!ids.length)return;
  var feats;try{feats=map.queryRenderedFeatures({layers:ids})}catch(e){feats=[]}
  var z=map.getZoom();
  if(!feats.length&&z>=11&&z<=16){
    labelMiss++;
    if(labelMiss>=3&&!labelFallback){labelFallback=true;ids.forEach(function(i){try{map.setPaintProperty(i,"text-opacity",1);map.setPaintProperty(i,"icon-opacity",1)}catch(e){}})}
  }else if(feats.length)labelMiss=0;
  if(labelFallback)return;
  var seen={},out=[];
  feats.forEach(function(f){
    var pr=f.properties||{},n=pr["name:latin"]||pr.name;
    var nk=n?String(n).trim().toLowerCase():"";
    if(!n||seen[nk]||!f.geometry||f.geometry.type!=="Point")return;
    var sl=f.sourceLayer||"",cls=pr.class||"";
    if(sl==="aerodrome_label")return;
    if(sl==="poi"&&!/museum|college|university|attraction|zoo|stadium/.test(cls))return;
    seen[nk]=1;
    out.push({n:n,ll:f.geometry.coordinates,pri:0,size:sl==="place"?(SIZES[cls]||13):(sl==="park"?13:12)});
  });
  var bnd=map.getBounds();
  EXTRA_LABELS.forEach(function(x){
    var k=x[0].toLowerCase();
    if(z<(x[3]?11:14))return;
    if(!bnd.contains([x[2],x[1]]))return;
    /* a hand-placed name replaces any built-in label with the same name */
    for(var i=out.length-1;i>=0;i--)if(out[i].n.trim().toLowerCase()===k)out.splice(i,1);
    seen[k]=1;out.push({n:x[0],ll:[x[2],x[1]],pri:1,size:x[3]?17:14});
  });
  out.sort(function(a,b){return (b.pri-a.pri)||(b.size-a.size)});
  /* keep labels from overlapping each other */
  var boxes=[],kept=[];
  out.forEach(function(o){
    var pt=map.project(o.ll),w=o.n.length*o.size*.6+8,hh=o.size*1.3+4;
    var r={x1:pt.x-w/2,x2:pt.x+w/2,y1:pt.y-hh/2,y2:pt.y+hh/2};
    for(var i=0;i<boxes.length;i++){var b=boxes[i];if(r.x1<b.x2&&r.x2>b.x1&&r.y1<b.y2&&r.y2>b.y1)return}
    boxes.push(r);kept.push(o);
  });
  out=kept.slice(0,45);
  var sig=Math.round(z*2)+":"+out.map(function(o){return o.n}).join("|");
  if(sig===labelSig)return;
  labelSig=sig;
  labelMarkers.forEach(function(m){m.remove()});labelMarkers=[];
  out.forEach(function(o){
    var el=h("div",{class:"plbl",text:o.n,style:"font-size:"+o.size+"px"});
    labelMarkers.push(new maplibregl.Marker({element:el,anchor:"center"}).setLngLat(o.ll).addTo(map));
  });
}

function openLightbox(urls,start,alt){
  var i=start,box=h("div",{class:"lb"}),img=h("img",{alt:alt||""}),ct=h("div",{class:"ct"});
  function show(){img.src=urls[i];ct.textContent=urls.length>1?(i+1)+" of "+urls.length:""}
  function close(){box.remove();document.removeEventListener("keydown",key)}
  function go(d){i=(i+d+urls.length)%urls.length;show()}
  function key(e){if(e.key==="Escape")close();else if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1)}
  var x0=null;
  box.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
  box.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(urls.length>1&&Math.abs(dx)>50)go(dx<0?1:-1)},{passive:true});
  box.addEventListener("click",function(e){if(e.target===box||e.target===img)close()});
  box.appendChild(img);
  box.appendChild(h("button",{class:"x",type:"button","aria-label":"Close",text:"×",onclick:close}));
  if(urls.length>1){
    box.appendChild(h("button",{class:"pv",type:"button","aria-label":"Previous",text:"‹",onclick:function(){go(-1)}}));
    box.appendChild(h("button",{class:"nx",type:"button","aria-label":"Next",text:"›",onclick:function(){go(1)}}));
  }

  document.body.appendChild(box);show();
}
function openPlace(p){
  var c=catOf(p.category),nodes=[];
  var ph=photos[p.id]||[];
  if(ph.length)nodes.push(h("div",{class:"gal"},ph.map(function(path,i){return h("img",{src:photoUrl(path),alt:p.name,loading:"lazy",onclick:function(){openLightbox(ph.map(photoUrl),i,p.name)}})})));
  var tags=[h("span",{class:"tag",text:c.icon+" "+c.label})];
  if(p.independent)tags.push(h("span",{class:"tag",text:"★ Independent"}));
  if(p.village)tags.push(h("span",{class:"tag",text:"📍 "+p.village}));
  if(p.status!=="approved")tags.push(h("span",{class:"tag",text:p.status==="pending"?"⏳ Waiting for approval":"Not approved"}));
  nodes.push(h("div",{},tags));
  if(p.note)nodes.push(h("p",{text:p.note}));
  if(p.details)nodes.push(h("p",{class:"mut",text:"ℹ️ "+p.details}));
  var links=[];
  var w=safeWeb(p.website);if(w)links.push(h("a",{href:w,target:"_blank",rel:"noopener noreferrer",text:"Website"}));
  var ig=cleanIg(p.instagram);if(ig)links.push(h("a",{href:"https://www.instagram.com/"+ig,target:"_blank",rel:"noopener noreferrer",text:"Instagram"}));
  var vu=safeWeb(p.video_url);if(vu)links.push(h("a",{href:vu,target:"_blank",rel:"noopener noreferrer",text:"▶ Watch video"}));
  if(links.length){
    var wrap=h("p",{});
    links.forEach(function(a,i){if(i)wrap.appendChild(document.createTextNode("  ·  "));wrap.appendChild(a)});
    nodes.push(wrap);
  }
  if(isAdmin){
    var ar=[];
    if(p.status!=="approved")ar.push(h("button",{class:"btn pri",type:"button",text:"Approve",onclick:function(){setStatus(p,"approved")}}));
    if(p.status==="pending")ar.push(h("button",{class:"btn",type:"button",text:"Reject",onclick:function(){setStatus(p,"rejected")}}));
    ar.push(h("button",{class:"btn",type:"button",text:"✏️ Edit",onclick:function(){openEditForm(p)}}));
    ar.push(h("button",{class:"btn",type:"button",text:"📍 Move pin",onclick:function(){startMove(p)}}));
    ar.push(h("button",{class:"btn",type:"button",text:"Delete",onclick:function(){delPlace(p,this)}}));
    nodes.push(h("div",{class:"row",style:"flex-wrap:wrap;margin:10px 0"},ar));
  }
  var revBox=h("div",{},[h("p",{class:"mut",text:"Loading reviews…"})]);
  nodes.push(h("h3",{text:"Reviews",style:"margin:18px 0 4px"}),revBox);
  openSheet(p.name,nodes);
  if(p.status==="approved")loadReviews(p,revBox);else revBox.replaceChildren(h("p",{class:"mut",text:"Reviews open once this place is approved."}));
}
function loadReviews(p,box){
  sb.from("reviews").select("rating,body,user_id,created_at").eq("place_id",p.id).order("created_at",{ascending:false}).then(function(r){
    var rows=r.data||[],kids=[];
    if(rows.length){
      var avg=rows.reduce(function(a,x){return a+x.rating},0)/rows.length;
      kids.push(h("p",{},[h("b",{text:stars(Math.round(avg))+" "+avg.toFixed(1)}),h("span",{class:"mut",text:" ("+rows.length+(rows.length===1?" review)":" reviews)")})]));
      rows.forEach(function(x){kids.push(h("div",{class:"card"},[h("b",{text:stars(x.rating)}),h("span",{text:x.body||""})]))});
    }else kids.push(h("p",{class:"mut",text:"No reviews yet."}));
    kids.push(reviewForm(p,box));
    box.replaceChildren.apply(box,kids);
  });
}
function reviewForm(p,box){
  if(!user)return h("button",{class:"btn",type:"button",text:"Sign in to leave a review",onclick:openAuth});
  var sel={value:"5"};
  var starBtns=[1,2,3,4,5].map(function(n){
    return h("button",{type:"button","aria-label":n+" star"+(n>1?"s":""),style:"background:none;border:0;padding:4px 6px;font-size:34px;line-height:1;cursor:pointer;color:inherit",text:"★",onclick:function(){sel.value=String(n);paint()}});
  });
  function paint(){starBtns.forEach(function(s,i){s.textContent=i<parseInt(sel.value,10)?"★":"☆"})}
  paint();
  var starRow=h("div",{style:"margin:4px 0 8px"},starBtns);
  var txt=h("textarea",{maxlength:"500",placeholder:"What was it like? Any tips?"});
  var b=h("button",{class:"btn dark",type:"button",text:"Post review"});
  b.addEventListener("click",function(){
    b.disabled=true;
    sb.from("reviews").upsert({place_id:p.id,user_id:user.id,rating:parseInt(sel.value,10),body:txt.value.trim()},{onConflict:"place_id,user_id"}).then(function(r){
      b.disabled=false;
      if(r.error){toast(errText(r.error));return}
      toast("Thanks for your review!");loadReviews(p,box);
    });
  });
  return h("div",{style:"margin-top:12px"},[h("label",{text:"Your review (one per place)"}),starRow,txt,h("div",{style:"margin-top:8px"},[b])]);
}
function setStatus(p,status){
  var patch={status:status};if(status==="approved")patch.approved_at=new Date().toISOString();
  sb.from("places").update(patch).eq("id",p.id).then(function(r){
    if(r.error){toast(errText(r.error));return}
    toast(status==="approved"?"Approved":"Rejected");closeSheet();loadPlaces();
  });
}
function delPlace(p,btn){
  if(btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent="Tap again to delete";return}
  var paths=photos[p.id]||[];
  sb.from("places").delete().eq("id",p.id).then(function(r){
    if(r.error){toast(errText(r.error));return}
    if(paths.length)sb.storage.from("photos").remove(paths);
    toast("Deleted");closeSheet();loadPlaces();
  });
}

  var note=h("textarea",{maxlength:"1000"});note.value=p.note||"";
  var det=h("input",{type:"text",maxlength:"200",placeholder:"Opening days, halal, tips…",autocomplete:"off"});det.value=p.details||"";
  var ind=h("input",{type:"checkbox",id:"eind"});ind.checked=!!p.independent;
  var web=h("input",{type:"text",maxlength:"200",inputmode:"url",autocomplete:"off"});web.value=p.website||"";
  var ig=h("input",{type:"text",maxlength:"60",autocomplete:"off"});ig.value=p.instagram||"";
  var msg=h("p",{class:"mut"});

    if(ig.value.trim()&&!cleanIg(ig.value)){msg.textContent="I couldn't read that Instagram name. Try just the handle.";return}

    sb.from("places").update({name:nm,category:cat.value,note:note.value.trim()||null,details:det.value.trim()||null,independent:ind.checked,
      website:safeWeb(web.value)||null,instagram:cleanIg(ig.value)||null}).eq("id",p.id).then(function(r){
      if(r.error){save.disabled=false;msg.textContent="Couldn't save: "+errText(r.error);return}
      closeSheet();toast("Saved");loadPlaces();

  openSheet("Edit place",[

    h("label",{text:"Type"}),cat,

    h("label",{text:"Instagram"}),ig,
    h("div",{style:"margin-top:14px"},[save]),msg
  ]);
}

/* ---------- add flow ---------- */
var prePick=null;
function gpsFrom(v,t){
  var le=v.getUint16(t)===0x4949;
  function u16(q){return v.getUint16(q,le)}function u32(q){return v.getUint32(q,le)}
  var ifd=t+u32(t+4),n=u16(ifd),gp=0,i,e;
  for(i=0;i<n;i++){e=ifd+2+i*12;if(u16(e)===0x8825)gp=t+u32(e+8)}
  if(!gp)return null;
  var cnt=u16(gp),la=null,lo=null,lar="N",lor="E";
  function rat(q){var a=t+u32(q+8);return u32(a)/u32(a+4)+(u32(a+8)/u32(a+12))/60+(u32(a+16)/u32(a+20))/3600}
  for(i=0;i<cnt;i++){e=gp+2+i*12;var tag=u16(e);
    if(tag===1)lar=String.fromCharCode(v.getUint8(e+8));else if(tag===3)lor=String.fromCharCode(v.getUint8(e+8));
    else if(tag===2)la=rat(e);else if(tag===4)lo=rat(e)}
  if(la==null||lo==null||!isFinite(la)||!isFinite(lo)||(la===0&&lo===0))return null;
  return[lar==="S"?-la:la,lor==="W"?-lo:lo];
}
function exifGps(buf){
  try{var v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;var o=2;
    while(o<v.byteLength-4){var m=v.getUint16(o),len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return gpsFrom(v,o+10);
      if((m&0xFF00)!==0xFF00)break;o+=2+len}}catch(e){}
  return null;
}
function startTap(){closeSheet();adding=true;$("banner").hidden=false;toast("Tap the map where the place is")}
function dropHere(ll){closeSheet();tempLL={lat:ll[0],lng:ll[1]};map.flyTo({center:[ll[1],ll[0]],zoom:17.5});showTemp();openAddForm()}
function addFromPhoto(f){
  if(!f)return;
  f.arrayBuffer().then(function(buf){
    var ll=exifGps(buf);prePick=f;
    if(ll){dropHere(ll)}
    else{closeSheet();adding=true;$("banner").hidden=false;toast("No location in that photo. Tap the map where it was taken.")}
  }).catch(function(){toast("Couldn't read that photo.")});
}
function addHere(msgEl){
  if(!navigator.geolocation){msgEl.textContent="Your phone isn't sharing its location with this page.";return}
  msgEl.textContent="Finding you…";
  navigator.geolocation.getCurrentPosition(function(pos){dropHere([pos.coords.latitude,pos.coords.longitude])},
    function(){msgEl.textContent="Couldn't get your location. Allow location for Safari, or tap the map instead."},
    {enableHighAccuracy:true,timeout:12000,maximumAge:15000});
}
$("addBtn").addEventListener("click",function(){
  if(!user){openAuth();return}
  var msg=h("p",{class:"mut"});
  var pf=h("input",{type:"file",accept:"image/*",hidden:true});
  pf.addEventListener("change",function(){addFromPhoto(pf.files&&pf.files[0]);pf.value=""});
  function big(t,fn){return h("button",{class:"btn pri",type:"button",text:t,style:"display:block;width:100%;margin:0 0 10px;text-align:left",onclick:fn})}
  openSheet("Add to village",[
    h("p",{class:"mut",text:"How would you like to place it?"}),
    big("📷  From a photo I took",function(){pf.click()}),
    big("📍  Here, where I'm standing",function(){addHere(msg)}),
    big("👆  Tap the map",startTap),
    pf,msg,
    h("p",{class:"mut",style:"font-size:12px",text:"For \"From a photo\": on iPhone, tap Options at the bottom of the photo picker and switch Location on, so the photo keeps where it was taken."})
  ]);
});
var picked=[];
function resize(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var m=1600,s=Math.min(1,m/Math.max(img.width,img.height));
      var cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(function(b){URL.revokeObjectURL(url);b?res(b):rej(new Error("Couldn't read that photo"))},"image/jpeg",.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Couldn't read that photo"))};
    img.src=url;
  });
}
function openAddForm(){
  $("banner").hidden=true;picked=prePick?[prePick]:[];prePick=null;
  var name=h("input",{type:"text",maxlength:"120",placeholder:"What is it called?",autocomplete:"off"});
  var cat=h("div",{class:"catgrid"});cat.value=CATS[0].id;
  function paintCat(){Array.prototype.forEach.call(cat.children,function(b){b.setAttribute("aria-pressed",b.getAttribute("data-id")===cat.value?"true":"false")})}
  CATS.forEach(function(c){cat.appendChild(h("button",{type:"button","data-id":c.id,text:c.icon+" "+c.label,onclick:function(){cat.value=c.id;paintCat()}}))});
  paintCat();
  var note=h("textarea",{maxlength:"1000",placeholder:"What's there? Why go?"});
  var ind=h("input",{type:"checkbox",id:"ind"});
  var web=h("input",{type:"text",maxlength:"200",placeholder:"www.example.co.uk",inputmode:"url",autocomplete:"off"});
  var ig=h("input",{type:"text",maxlength:"60",placeholder:"handle, like cambridgecyclesmith",autocomplete:"off"});
  var vid=h("input",{type:"text",maxlength:"300",placeholder:"Paste a YouTube, Instagram or album link",inputmode:"url",autocomplete:"off"});
  var thumbs=h("div",{class:"thumbs"});
  var file=h("input",{type:"file",accept:"image/*",multiple:true,hidden:true});
  file.addEventListener("change",function(){
    var fs=Array.prototype.slice.call(file.files||[]);
    fs.forEach(function(f){if(picked.length<8)picked.push(f)});
    file.value="";
    thumbs.replaceChildren.apply(thumbs,picked.map(function(f){return h("img",{src:URL.createObjectURL(f),alt:""})}));
  });
  if(picked.length)thumbs.replaceChildren.apply(thumbs,picked.map(function(f){return h("img",{src:URL.createObjectURL(f),alt:""})}));
  var msg=h("p",{class:"mut"});
  var go=h("button",{class:"btn pri",type:"button",text:isAdmin?"Add place":"Send for approval"});
  go.addEventListener("click",function(){
    var nm=name.value.trim();
    if(!nm){msg.textContent="Please give it a name.";return}
    if(ig.value.trim()&&!cleanIg(ig.value)){msg.textContent="I couldn't read that Instagram name. Try just the handle, like cambridgecyclesmith.";return}
    go.disabled=true;msg.textContent="Saving…";
    var row={name:nm,category:cat.value,note:note.value.trim()||null,independent:ind.checked,
      website:safeWeb(web.value)||null,instagram:cleanIg(ig.value)||null,video_url:safeWeb(vid.value)||null,
      lat:tempLL.lat,lng:tempLL.lng,status:isAdmin?"approved":"pending"};
    if(isAdmin)row.approved_at=new Date().toISOString();
    sb.from("places").insert(row).select().single().then(function(r){
      if(r.error)throw r.error;
      var place=r.data;
      return picked.reduce(function(chain,f,i){
        return chain.then(function(){return resize(f)}).then(function(blob){
          var path=user.id+"/"+place.id+"-"+i+".jpg";
          return sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"}).then(function(u){
            if(u.error)throw u.error;
            return sb.from("place_photos").insert({place_id:place.id,path:path});
          }).then(function(q){if(q.error)throw q.error});
        });
      },Promise.resolve());
    }).then(function(){
      closeSheet();
      toast(isAdmin?"Added!":"Thanks! It will appear once approved.");
      loadPlaces();
    }).catch(function(e){go.disabled=false;msg.textContent="Couldn't save: "+errText(e)});
  });
  openSheet("Add to village",[
    h("p",{class:"mut",text:"Share what you found."}),
    h("label",{text:"Name"}),name,
    h("label",{text:"Type"}),cat,
    h("label",{text:"Notes"}),note,
    h("div",{class:"row",style:"margin-top:12px"},[ind,h("label",{for:"ind",style:"margin:0",text:"Independent (not a chain)"})]),
    h("label",{text:"Website (optional)"}),web,
    h("label",{text:"Instagram (optional)"}),ig,
    h("label",{text:"Video link (optional)"}),vid,
    h("label",{text:"Photos"}),
    h("button",{class:"btn",type:"button",text:"📷 Add photos",onclick:function(){file.click()}}),file,thumbs,
    h("div",{style:"margin-top:16px"},[go]),msg
  ]);
}
